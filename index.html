<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Counter App</title>
    <link
      rel="shortcut icon"
      href="./images/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="counter-body">
          <header class="header">
            <a href="#" class="header-logo">
              <img src="./images/logo-dark-theme.svg" alt="Character Counter" />
            </a>
            <button class="mode-switcher" aria-label="Switch to light theme">
              <img src="./images/icon-sun.svg" alt="" />
            </button>
          </header>

          <main>
            <h1 class="main-title">Analyze your text in real-time.</h1>
            <section class="main-block">
              <textarea
                name="text"
                id="text-input"
                class="main-textarea"
                placeholder="Start typing here… (or paste your text)"
                aria-label="Text to analyze"
                aria-describedby="character-limit-error"
              ></textarea>
              <div class="textarea-error hide">
                <div class="textarea-error_img">
                  <img src="./images/icon-info.svg" alt="" />
                </div>
                <p
                  class="textarea-error_text"
                  id="character-limit-error"
                  role="alert"
                ></p>
              </div>
              <div class="main-block_options">
                <ul class="options-list">
                  <li class="options-item">
                    <input
                      class="option-checkbox exclude-spaces_checkbox"
                      type="checkbox"
                      id="exclude-spaces"
                      name="exclude-spaces"
                    />
                    <label for="exclude-spaces">Exclude Spaces</label>
                  </li>
                  <li class="options-item">
                    <input
                      class="option-checkbox set-character-limit"
                      type="checkbox"
                      id="character-limit"
                      name="character-limit"
                    />
                    <label for="character-limit">Set Character Limit</label>
                    <input type="number" class="char-limit hide" />
                  </li>
                </ul>
                <p class="options-approx">Approx. reading time: &lt;1 minute</p>
              </div>
            </section>
            <section class="cards-results">
              <div class="results-row">
                <div class="results-column results-column_total">
                  <p class="column-results_number total-characters">00</p>
                  <p class="column-results_text">Total Characters</p>
                </div>
                <div class="results-column results-column_word">
                  <p class="column-results_number word-count">00</p>
                  <p class="column-results_text">Word Count</p>
                </div>
                <div class="results-column results-column_sentence">
                  <p class="column-results_number sentence-count">00</p>
                  <p class="column-results_text">Sentence Count</p>
                </div>
              </div>
            </section>
            <section class="density">
              <h2 class="density-title">Letter Density</h2>
              <ul class="density-list"></ul>
              <button class="see-more" aria-expanded="false">
                <p class="button-text">See more</p>
                <div class="button-img">
                  <img src="./images/Title.svg" alt="" />
                </div>
              </button>
            </section>
          </main>
        </div>
      </div>
    </div>
    <script src="./js/script.js"></script>
  </body>
</html>
